[project]
name = "paperbroker-backend"
version = "0.1.0"
description = "PaperBroker — paper-trading broker with a discipline engine (Kane CLI hackathon)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "SQLAlchemy==2.0.36",  # pinned: newer wheels' compiled ext gets blocked by Windows Smart App Control (BUILD_LOG, Mon Nov 23)
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
